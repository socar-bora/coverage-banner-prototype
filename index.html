* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--accent-ink); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---- page header */
.top { padding-block: 22px 8px; }
.top .inner { max-width: 1120px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 24px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.top h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; margin-top: 4px; text-wrap: balance; }
.top .sub { font-size: 13px; color: var(--fg-2); margin-top: 4px; max-width: 64ch; }
.top .links { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.lnk { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-decoration: none; color: var(--fg-2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: var(--surface); }
.lnk:hover { color: var(--accent-ink); border-color: var(--accent); }

/* ---- stage */
.stage { max-width: 1120px; margin: 0 auto; padding-block: 16px 48px; display: grid; grid-template-columns: 375px minmax(300px, 1fr); gap: 32px; align-items: start; justify-content: center; }
.phone-col { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.hint { font-size: 12px; color: var(--fg-3); text-align: center; max-width: 375px; }
.hint b { color: var(--fg-2); font-weight: 600; }
.panel { position: sticky; top: calc(16px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); }
.card h2 { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-3); margin-bottom: 12px; }
.ctl { display: grid; grid-template-columns: 112px 1fr; gap: 10px 12px; align-items: center; }
.ctl label { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.ctl small { display: block; font-weight: 500; color: var(--fg-3); font-size: 11px; margin-top: 1px; }
.seg { display: flex; background: var(--seg-bg); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 7px 8px; font-size: 13px; font-weight: 600; color: var(--fg-2); cursor: pointer; transition: background .15s, color .15s; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--fg); box-shadow: 0 1px 2px rgba(20,26,36,.12); }
.seg button:disabled { cursor: not-allowed; opacity: .45; }
.seg.is-locked { opacity: .9; }
.seg.is-locked button[aria-pressed="true"] { color: var(--fg-2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--fg); }
.btn:hover { border-color: var(--accent); color: var(--accent-ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { color: #fff; filter: brightness(1.05); }

.now { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
.chip.ghost { background: transparent; border: 1px solid var(--line); color: var(--fg-2); font-weight: 600; }
.chip.modal { background: var(--fg); color: var(--bg); }
.now .fig { margin-inline-start: auto; font-size: 12px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.now .fig:hover { text-decoration: underline; }
.rules { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.rules li { position: relative; padding-left: 14px; font-size: 13px; color: var(--fg-2); line-height: 1.5; }
.rules li::before { content: ""; position: absolute; left: 0; top: 7px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.rules b { color: var(--fg); font-weight: 600; }
.rules .note::before { background: var(--warn); }
.guide { margin-top: 10px; font-size: 12px; color: var(--fg-3); line-height: 1.5; }
.guide::before { content: "Figma 라벨 · "; font-family: var(--mono); font-size: 11px; }
.memo { margin-top: 12px; font-size: 12px; color: var(--fg-3); line-height: 1.55; }
.memo b { color: var(--fg-2); font-weight: 600; }
.card.is-active { border-color: var(--accent); }
.log { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; max-height: 164px; overflow: auto; }
.log li { font-size: 12px; color: var(--fg-2); display: flex; gap: 8px; align-items: baseline; }
.log li time { font-family: var(--mono); font-size: 11px; color: var(--fg-3); flex: none; }
.log li.empty { color: var(--fg-3); }
.log b { color: var(--fg); font-weight: 600; }
.kbd { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }

@media (max-width: 860px) {
  .stage { grid-template-columns: 1fr; justify-items: center; }
  .panel { position: static; width: 100%; max-width: 560px; }
}
@media (max-width: 430px) {
  .phone { zoom: .9; }
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ================= phone (fixed light surface — 375 × 891 like the Figma frame) */
.phone { position: relative; width: 375px; height: 891px; overflow: hidden; background: #fff; border-radius: 30px; box-shadow: 0 0 0 1px rgba(20,26,36,.08), 0 24px 60px -20px rgba(20,26,36,.45); font-family: var(--font); color: #354153; font-size: 14px; line-height: 22px; letter-spacing: 0; flex: none; user-select: none; -webkit-user-select: none; -webkit-font-smoothing: antialiased; }
.phone * { box-sizing: border-box; }
:where(.phone) p { margin: 0; }
:where(.phone) button { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; }

.toggle { display: flex; align-items: center; height: 38px; padding: 0 3px; background: #F2F3F8; border: 1px solid #F2F3F8; border-radius: 170px; }
.toggle .tchip { width: 47px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 14px; line-height: 22px; font-weight: 600; color: #697383; border-radius: 110px; }
.toggle .tchip.on { height: 32px; background: #0078FF; color: #fff; }
.zone-card { background: #F9F9FB; border: 1px solid #F2F3F8; border-radius: 16px; padding: 11px 13px; }
.zone-loc { display: flex; align-items: center; gap: 8px; height: 26px; }
.renttype { display: inline-flex; align-items: center; height: 26px; padding: 0 5px; background: #EBF5FF; border: 1px solid #D6EBFF; border-radius: 8px; font-size: 12px; line-height: 18px; font-weight: 600; color: #0069FF; white-space: nowrap; }
.zone-name { flex: 1; min-width: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: #141A24; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zone-div { height: 23px; padding: 12px 0 10px; }
.zone-div i { display: block; height: 1px; background: #E5E8EF; border-radius: 2px; }
.zone-time { display: flex; align-items: center; gap: 12px; height: 22px; font-size: 14px; line-height: 22px; font-weight: 600; color: #354153; }
.zone-time span { flex: 1; min-width: 0; white-space: nowrap; }
.zoneinfo { height: 52px; padding: 17px 16px 11px; display: flex; align-items: center; justify-content: space-between; }
.zone-title { font-size: 16px; line-height: 24px; font-weight: 600; color: #354153; }
.zone-more { font-size: 14px; line-height: 22px; font-weight: 400; color: #697383; }
/* scrollable content: banner + car list (Figma: Frame 2085668017 at 16/227, gap 18) */
.content { position: absolute; left: 0; top: 227px; width: 375px; height: 558px; overflow-y: auto; overflow-x: hidden; padding: 0 16px 40px; display: flex; flex-direction: column; gap: 18px; scrollbar-width: none; overscroll-behavior: contain; }
.content::-webkit-scrollbar { display: none; }

/* ---- coverage banner */
.banner { width: 343px; flex: none; border-radius: 12px; text-align: left; }
.banner.open { padding: 16px 12px 20px; }
.banner.open.cov-full { background: linear-gradient(180deg, #E5E9FC 0%, #EFF2FF 32%, #EFF2FF 33%, #FFFFFF 100%); }
.banner.open.cov-silsok { padding-bottom: 16px; background: linear-gradient(180deg, #F2F3F8 0%, #F2F3F8 32%, #F2F3F8 33%, #FFFFFF 100%); }
.banner.open.cov-jeju { background: linear-gradient(180deg, #DAF4F6 0%, #EBFAFF 32%, #EBFAFF 33%, #FFFFFF 100%); }
.banner.closed { padding: 14px 12px; cursor: pointer; }
.banner.closed.cov-full { background: #ECEFFE; }
.banner.closed.cov-silsok { background: #F2F3F8; }
.banner.closed.cov-jeju { background: #E9F6FA; }
.banner.closed:active { filter: brightness(.97); }
.bn-head { display: flex; align-items: center; gap: 12px; width: 319px; }
.bn-title { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.bn-title p { font-size: 16px; line-height: 24px; font-weight: 600; color: #354153; white-space: nowrap; }
.cov-jeju .bn-title { gap: 10px; }
.cov-jeju .bn-title p { font-size: 14px; line-height: 22px; }
.bn-title b, .bn-t1 b, .bn-t2 b { font-weight: 600; }
.c-full { color: #1C36E0; } .c-silsok { color: #637080; } .c-jeju { color: #0097B1; } .c-jeju-dark { color: #0086A0; }
.bn-chev { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex: none; border-radius: 6px; }
.bn-chev:active { background: rgba(20,26,36,.06); }
.bn-list { margin-top: 18px; display: flex; flex-direction: column; gap: 4px; width: 319px; }

.chk-ic { width: 24px; height: 20px; display: flex; align-items: center; justify-content: center; flex: none; }

.bn-q { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; flex: none; }

    var c = listCov(), label = c === 'full' ? '완전보장' : '실속보장';
    var bottom = r.black
      ? '<div class="covrow-black"><span class="credit">크레딧 적용가</span>' + teukPill('완전보장 대신 특약 적용') + '</div>'
      : '<div class="covrow">' + covtag(c, label) + ico('dot') + '<span class="credit">크레딧 적용가</span></div>';
    return '<div class="car-row">' + thumb(r) + '<div class="info"><div class="namewrap"><p class="car-name">' + r.name + '</p>' + tag10() + '</div>' +
      '<div class="pricewrap">' + prices() + bottom + '</div></div></div>';
  }
  function pill(p) {
    if (Array.isArray(p)) return '<span class="pill emph"><span class="newlab">' + I.newLabel + '</span><span>' + p[1] + '</span></span>';
    return '<span class="pill">' + p + '</span>';
  }
  function rowJeju(r) {
    var bottom = r.black ? teukPill('완전면책 대신 특약 적용') : '<div class="covrow">' + covtag('jeju', '완전면책') + '</div>';
    return '<div class="car-row">' + thumb(r) + '<div class="info"><div class="namewrap' + (r.black ? ' black' : '') + '"><p class="car-name">' + r.name + '</p><div class="pills">' + r.pills.map(pill).join('') + '</div></div>' +
      '<div class="pricewrap">' + prices() + bottom + '</div></div></div>';
  }
  function renderList() {
    var rows = state.region === 'jeju' ? JEJU_ROWS.map(rowJeju) : INLAND_ROWS.map(rowInland);
    return '<div class="car-list">' + rows.join('<div class="car-div"></div>') + '</div>';
  }

  /* ---------- 특약 modal */
  function renderModal() {
    if (!state.modal) return '';
    return '<div class="dim" data-act="close-modal"></div>' +
      '<div class="teuk-modal" role="dialog" aria-modal="true" aria-label="자차손해담보 특약 안내">' +
        '<div class="md-body"><div class="md-text"><p class="md-title">일부 고급차종은 자차손해담보 특약이 적용돼요</p>' +
        '<p class="md-desc">포르쉐 등 일부 고급 차종은 쏘카 보장상품(완전보장·실속보장) 대신 보험사의 자기차량손해담보 특약으로 차량 손해를 보장합니다.</p></div>' +
        '<div class="md-card"><div class="md-kv"><span>특약 요금</span><b>무료</b></div><div class="md-kv"><span>사고시 내 부담</span><b>최대 200만원</b></div><div class="md-kv"><span>대인·대물·자손 보험</span><b>기본 포함</b></div></div></div>' +
        '<div class="md-btns"><div class="md-fade"></div><button type="button" class="btn-primary" data-act="close-modal">확인</button>' +
        '<button type="button" class="btn-text" data-act="link-detail">보험 및 보장상품 자세히</button><div class="md-footer"><span class="home-bar"></span></div></div>' +
      '</div>';
  }

  /* ---------- phone shell */
  function renderPhone() {
    return '<div class="ph-map" role="img" aria-label="지도"></div>' +
      '<div class="ph-status" aria-hidden="true">' + I.statusBar + '</div>' +
      '<button type="button" class="ph-back" data-act="back" aria-label="뒤로">' + I.back + '</button>' +
      '<div class="sheet"><div class="handle"><span></span></div>' +
        '<div class="bs-head"><div class="waytype"><div class="waytype-title"><span>가지러 가기</span>' + ico('chevronDown') + '</div>' +
          '<div class="toggle"><span class="tchip on">왕복</span><span class="tchip">편도</span></div></div>' +
          '<div class="zone-card"><div class="zone-loc"><span class="renttype">대여∙반납</span><span class="zone-name">카케이주차장</span>' + ico('search') + '</div>' +
          '<div class="zone-div"><i></i></div><div class="zone-time"><span>2. 14. (금) 14:00 ~ 2. 15. (토) 14:00</span>' + ico('chevronRight') + '</div></div></div>' +
        '<div class="zoneinfo"><span class="zone-title">지하 주차장</span><span class="zone-more">자세히</span></div>' +
        '<div class="content" id="content">' + renderBanner() + renderList() + '</div>' +
      '</div>' + renderModal();
  }

  /* ---------- reviewer panel */
  function stateKey() { return state.region + '-' + cov() + '-' + (state.bannerOpen ? 'open' : 'closed'); }
  function stateLabel() {
    var c = cov();
    return (state.region === 'jeju' ? '제주' : '내륙') + ' · ' + ({ full: '완전보장', silsok: '실속보장', jeju: '완전면책' })[c] + (switched() ? ' (바꾸기 후)' : '') + ' · ' + (state.bannerOpen ? '펼침' : '닫힘');
  }
  /* 피그마 가이드구분 / 화면구분명 라벨을 그대로 인용 */
  var GUIDE = { 'inland-full': '내륙 - 기본 선택 값, 지난 예약: 완전보장', 'inland-silsok': '내륙 - 지난 예약: 실속보장', 'jeju-jeju': '제주 - only, 완전면책' };
  var SCREEN = { open: '최초 진입 시', closed: '닫기 액션 + 한 번 봤다의 판단 근거 → 닫혀서 제공', modal: '공통) 블랙라벨 특약 내용 info 선택 시', switched: '실속 보장 → 완전보장으로 바꾸기 누른 경우' };
  var RULES = {
    'inland-full-open': ['지난 예약이 <b>완전보장</b>인 사용자의 기본값: 완전보장 혜택 4줄이 펼쳐진 배너', '차종 태그는 <b>완전보장 · 크레딧 적용가</b>', '블랙라벨 차종은 보장상품 태그 대신 <b>“완전보장 대신 특약 적용 ⓘ”</b> (탭 → 특약 안내 바텀시트)'],
    'inland-full-closed': ['<b>∧ 닫기</b>를 눌렀거나 한 번 본 사용자에게는 한 줄 요약으로 접혀서 제공: “사고 나도 내 부담 0원”', '총결제 요금에 <b>완전보장 + 주행요금 혜택</b>이 포함됨을 안내', '차종 리스트는 펼침 상태와 동일'],
    'inland-silsok-open': ['지난 예약이 <b>실속보장</b>인 사용자: 혜택 나열 대신 <b>완전보장 업셀 모듈</b>', '사고 시 내 부담 <s>70만원</s> → 0원 비교 + 추가 혜택 2줄 + <b>바꾸기</b>', '<b>바꾸기</b> 탭 → 완전보장으로 전환되고 배너·리스트 태그가 완전보장으로 바뀜', '차종 태그는 <b>실속보장 · 크레딧 적용가</b> (회색 실드)'],
    'inland-silsok-closed': ['닫힌 상태의 한 줄 요약: “사고 시 최대 70만원 부담”', '업셀 모듈은 닫힘 상태에서 노출되지 않음 (펼쳐야 바꾸기 가능)'],
    'switched-open': ['<b>바꾸기</b>를 누른 뒤: 완전보장 배너(혜택 4줄)로 바뀌고, 배너 하단에 <b>↻ 실속보장으로 되돌리기</b> 링크가 붙음 (피그마 신규 화면)', '차종 리스트 태그도 <b>완전보장 · 크레딧 적용가</b>로 함께 바뀜 (피그마 시안에는 실속보장으로 남아 있음 → 완전보장으로 수정 예정)', '<b>되돌리기</b> 탭 → 실속보장 업셀 배너·실속보장 태그로 복귀'],
    'switched-closed': ['바꾸기 후 배너를 접으면 완전보장 닫힘 요약 (피그마에 별도 화면 없음 · 프로토타입 가정)', '다시 펼치면 되돌리기 링크가 있는 완전보장 배너'],
    'jeju-jeju-open': ['제주는 보장상품 선택 없이 <b>제주 전용 완전면책</b> 하나로 고정 (실속보장/바꾸기 없음)', '혜택 4줄에 <b>항공 지연 부분 환불 · 무상 연장</b>이 들어감 (시안 색상 · 강조 굵기)', '차종 행은 연식/차급/인승 태그 + 완전면책 태그, <b>크레딧 적용가 문구 없음</b>', '블랙라벨은 “완전면책 대신 특약 적용 ⓘ”만 노출'],
    'jeju-jeju-closed': ['닫힌 상태의 한 줄 요약: “사고 나도 0원 + 항공 지연·결항 보상”', '총결제 요금에 완전면책 + 주행요금 혜택 포함 안내']
  };
  var MEMO_EXPAND = '피그마 메모 “배너 영역 클릭 시 → 왼쪽처럼 펼쳐짐” 그대로: 닫힌 배너를 탭하면 다시 펼쳐져요';
  function renderPanel() {
    var key = stateKey();
    var $ = function (id) { return document.getElementById(id); };
    ['region', 'coverage', 'entry'].forEach(function (k) {
      var seg = $('seg-' + k);
      Array.prototype.forEach.call(seg.querySelectorAll('button'), function (b) {
        var v = b.getAttribute('data-v');
        var on = k === 'entry' ? ((state.bannerOpen ? 'first' : 're') === v) : (k === 'coverage' ? state.lastCoverage === v : state[k] === v);
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
      });
    });
    var locked = state.region === 'jeju';
    var covSeg = $('seg-coverage');
    covSeg.classList.toggle('is-locked', locked);
    Array.prototype.forEach.call(covSeg.querySelectorAll('button'), function (b) { b.disabled = locked; });
    var lock = $('cov-lock');
    if (locked) { lock.hidden = false; lock.textContent = '제주 only · 완전면책 고정'; }
    else if (state.coverage !== state.lastCoverage) { lock.hidden = false; lock.textContent = '바꾸기로 현재는 완전보장'; }
    else { lock.hidden = true; lock.textContent = ''; }
    $('now-label').textContent = stateLabel();
    var m = $('now-modal'); m.hidden = !state.modal;
    var sw = switched();
    var fig = $('fig-link'); var node = state.modal ? NODES.modal : (sw && state.bannerOpen ? NODES.switched : NODES[key]);
    fig.href = FIGMA + '?node-id=' + node; fig.hidden = !node;
    var guideKey = sw ? 'inland-silsok' : state.region + '-' + cov();
    $('guide-label').textContent = GUIDE[guideKey] + ' · ' + (state.modal ? SCREEN.modal : (sw ? (state.bannerOpen ? SCREEN.switched : SCREEN.closed + ' (바꾸기 후)') : (state.bannerOpen ? SCREEN.open : SCREEN.closed)));
    var ruleKey = sw ? (state.bannerOpen ? 'switched-open' : 'switched-closed') : key;
    var rules = (RULES[ruleKey] || []).map(function (r) { return '<li>' + r + '</li>'; }).join('');
    if (!state.bannerOpen) rules += '<li class="note">' + MEMO_EXPAND + '</li>';
    $('rules').innerHTML = rules;
    var log = $('log');
    log.innerHTML = state.log.length ? state.log.slice(-8).reverse().map(function (e) { return '<li><time>' + e.t + '</time><span>' + e.m + '</span></li>'; }).join('') : '<li class="empty">아직 동작이 없어요. 폰 화면을 눌러보세요.</li>';
  }

  function log(msg) {
    var d = new Date(); var t = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ':' + ('0' + d.getSeconds()).slice(-2);
    state.log.push({ t: t, m: msg });
  }
  var phone = document.getElementById('phone');
  function render(keepScroll) {
    var top = keepScroll ? (document.getElementById('content') || {}).scrollTop || 0 : 0;
    phone.innerHTML = renderPhone();
    if (top) document.getElementById('content').scrollTop = top;
    renderPanel();
  }

  /* ---------- interactions */
  phone.addEventListener('click', function (ev) {
    var el = ev.target.closest('[data-act]'); if (!el || !phone.contains(el)) return;
    var act = el.getAttribute('data-act');
    if (act === 'collapse') { state.bannerOpen = false; log('<b>∧ 탭</b> → 배너 닫힘'); render(true); }
    else if (act === 'expand') { state.bannerOpen = true; log('<b>닫힘 배너 탭</b> → 배너 펼침'); render(true); }
    else if (act === 'switch-full') {
      state.coverage = 'full'; state.bannerOpen = true;
      log('<b>바꾸기</b> → 보장상품이 실속보장에서 <b>완전보장</b>으로 전환 (배너에 되돌리기 링크 · 리스트 태그도 완전보장)');
      render(true);
    }
    else if (act === 'undo-switch') { state.coverage = state.lastCoverage; state.bannerOpen = true; log('<b>실속보장으로 되돌리기</b> → 실속보장 업셀 배너·실속보장 태그로 복귀'); render(true); }
    else if (act === 'open-modal') { state.modal = true; log('<b>특약 적용 ⓘ 탭</b> → 자차손해담보 특약 안내 바텀시트'); render(true); }
    else if (act === 'close-modal') { state.modal = false; log(el.classList.contains('dim') ? '딤 영역 탭 → 바텀시트 닫힘' : '<b>확인</b> → 바텀시트 닫힘'); render(true); }
    else if (act === 'link-detail') { log('<b>보험 및 보장상품 자세히</b> 탭 (이 프로토타입에서는 연결된 화면 없음)'); renderPanel(); }
    else if (act === 'back') { log('뒤로가기 탭 (이 프로토타입에서는 연결된 화면 없음)'); renderPanel(); }
  });
  phone.addEventListener('keydown', function (ev) {
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('data-act') === 'expand') { ev.preventDefault(); ev.target.click(); }
  });
  document.getElementById('panel').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    var seg = b.closest('.seg');
    if (seg) {
      var k = seg.id.replace('seg-', ''), v = b.getAttribute('data-v');
      if (k === 'entry') { state.bannerOpen = (v === 'first'); log('패널: 배너 → ' + (v === 'first' ? '최초 진입 시 (펼침)' : '한 번 본 후 (닫힘)')); }
      else if (k === 'coverage') { state.lastCoverage = v; state.coverage = v; log('패널: 지난 예약 보장상품 → ' + b.textContent.trim()); }
      else { state.region = v; state.coverage = state.lastCoverage; log('패널: 지역 → ' + b.textContent.trim()); }
      state.modal = false; render(false); return;
    }
    var act = b.getAttribute('data-act');
    if (act === 'open-modal') { state.modal = true; log('패널: 특약 안내 바텀시트 열기'); render(true); }
    else if (act === 'preset-switched') { state.region = 'inland'; state.lastCoverage = 'silsok'; state.coverage = 'full'; state.bannerOpen = true; state.modal = false; log('패널: “바꾸기 누른 경우” 화면으로 바로 이동'); render(false); }
    else if (act === 'reset') { state.region = 'inland'; state.lastCoverage = 'full'; state.coverage = 'full'; state.bannerOpen = true; state.modal = false; state.log = []; render(false); }
  });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && state.modal) { state.modal = false; log('Esc → 바텀시트 닫힘'); render(true); } });
  render(false);
})();
</script>
</body>
</html>
